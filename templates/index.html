<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat or Dog Classifier</title>
  <style>
    body {
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      font: 1rem/1.5 system-ui, sans-serif;
      color: #202124;
    }

    form, .result {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border: 1px solid #dadce0;
      border-radius: 0.75rem;
    }

    input, button {
      margin-top: 0.75rem;
      font: inherit;
    }

    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 360px;
      margin-top: 1rem;
      border-radius: 0.5rem;
    }

    .error {
      color: #b3261e;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cat or Dog Classifier</h1>
    <p>Upload a JPG or PNG image to classify it.</p>

    <form method="post" enctype="multipart/form-data">
      <label for="image">Choose an image (JPG or PNG, up to 5 MB)</label><br>
      <input id="image" name="image" type="file" accept=".jpg,.jpeg,.png" required>
      <br>
      <button type="submit">Classify image</button>
    </form>

    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    {% if prediction %}
    <section class="result" aria-live="polite">
      <h2>Prediction: {{ prediction }}</h2>
      <p>Confidence: {{ score }}%</p>
      {% if preview %}
      <img src="data:image/jpeg;base64,{{ preview }}" alt="Uploaded image">
      {% endif %}
    </section>
    {% endif %}
  </main>
</body>
</html>
